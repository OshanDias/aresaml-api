spring.application.name=AresAML API

# Locally this is 8080. Cloud hosts (Render, Railway, etc.) inject a PORT env
# variable and expect the app to listen on it - this honours that automatically.
server.port=${PORT:8080}

# Allow reasonably sized CSV uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Pretty-print JSON responses so they are easy to read in the browser
spring.jackson.serialization.indent-output=true
